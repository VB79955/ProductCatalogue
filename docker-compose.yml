services:
  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - catalogue

  app:
    build:
      context: .
      target: app
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - catalogue

  horizon:
    build:
      context: .
      target: app
    command: php artisan horizon
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      HORIZON_DASHBOARD_OPEN: "true"
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - catalogue

  scheduler:
    build:
      context: .
      target: app
    command: php artisan schedule:work
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - app
    networks:
      - catalogue

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalogue
      MYSQL_USER: catalogue
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - catalogue

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - catalogue

volumes:
  mysql_data:

networks:
  catalogue:
    driver: bridge
